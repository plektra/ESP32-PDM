; ESP32-PDM firmware (draft). Build: pio run -e pdm    Host tests: pio test -e native
[platformio]
default_envs = pdm

[env:pdm]
; ESP32-S3-MINI-1-N8 (8 MB quad flash, no PSRAM), native USB on IO19/IO20 (decision 4).
platform = espressif32@6.9.0
board = esp32-s3-devkitm-1
framework = arduino
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Wall
lib_deps =
    ttlappalainen/NMEA2000-library@^4.22.0
test_ignore = *

[env:native]
; The control logic in lib/pdm_core runs on the development machine.
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall
lib_compat_mode = off
test_filter = test_core
